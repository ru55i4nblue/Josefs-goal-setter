name: Release

# Builds installers for macOS (.dmg) and Windows (Setup .exe) and publishes
# them as a GitHub Release. Trigger by pushing a tag like v1.0.0, or manually
# from the Actions tab (manual runs attach artifacts to a draft release).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    # Intel runner on purpose. macos-latest is Apple Silicon, and electron-builder's
    # DMG step fails there when it cross-builds the x64 image — `hdiutil detach`
    # errors with "No such file or directory" after exhausting its retries. An
    # Intel host builds both the arm64 and x64 DMGs without that fault.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: win-setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      # needed for CHANGELOG.md + the notes script
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: files

      # Build the release body from this version's CHANGELOG section, so each
      # release lists exactly what changed since the previous one.
      - name: Build release notes
        run: node scripts/release-notes.js "${{ github.ref_name }}" > NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: NOTES.md
