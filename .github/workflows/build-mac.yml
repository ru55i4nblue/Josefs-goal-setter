name: Build macOS app

# Builds a Goal Setter .dmg on a cloud Mac for testing, WITHOUT publishing a
# release. Run it from the repo's "Actions" tab -> "Build macOS app" ->
# "Run workflow", then download the .dmg from the run's "Artifacts" section.
#
# Manual only: releases are cut by tagging (see release.yml). This used to run on
# every push to main, which meant a tag push started this and the release build
# at the same time — two concurrent macOS builds that intermittently failed.

on:
  workflow_dispatch:

jobs:
  build-mac:
    # Intel runner — see the note in release.yml: electron-builder's DMG step
    # fails on Apple Silicon runners when cross-building the x64 image.
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # no code signing (unsigned build)

      - uses: actions/upload-artifact@v4
        with:
          name: goal-setter-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
