name: Release

# Builds installers for macOS (.dmg) and Windows (Setup .exe) and publishes
# them as a GitHub Release. Trigger by pushing a tag like v1.0.0, or manually
# from the Actions tab (manual runs attach artifacts to a draft release).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Apple Silicon gets a .dmg; Intel gets a .zip. electron-builder's DMG step
      # fails when it cross-builds the x64 image on an Apple Silicon runner
      # (hdiutil detach: "No such file or directory"), and the Intel runners that
      # avoid it now queue for tens of minutes. A zip needs no hdiutil at all.
      - uses: actions/upload-artifact@v4
        with:
          name: mac-builds
          path: |
            dist/*.dmg
            dist/*-mac.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: win-setup
          path: dist/*.exe
          if-no-files-found: error

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      # needed for CHANGELOG.md + the notes script
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: files

      # Build the release body from this version's CHANGELOG section, so each
      # release lists exactly what changed since the previous one.
      - name: Build release notes
        run: node scripts/release-notes.js "${{ github.ref_name }}" > NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          body_path: NOTES.md
